<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="bgRed" cx="12%" cy="15%" r="78%">
      <stop offset="0%" stop-color="#ff5a4d"/>
      <stop offset="100%" stop-color="#ff5a4d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgYellow" cx="55%" cy="6%" r="70%">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgCyan" cx="92%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#4de8e8"/>
      <stop offset="100%" stop-color="#4de8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgPink" cx="82%" cy="88%" r="75%">
      <stop offset="0%" stop-color="#ff4d9e"/>
      <stop offset="100%" stop-color="#ff4d9e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgCyan2" cx="8%" cy="88%" r="70%">
      <stop offset="0%" stop-color="#4dd4ff"/>
      <stop offset="100%" stop-color="#4dd4ff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e4e6ea"/>
      <stop offset="55%" stop-color="#9aa0a8"/>
      <stop offset="80%" stop-color="#4a4e56"/>
      <stop offset="100%" stop-color="#26282e"/>
    </linearGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="48" fill="#e0a53d"/>
  <g clip-path="url(#clip)">
    <clipPath id="clip"><rect width="256" height="256" rx="48"/></clipPath>
    <g style="mix-blend-mode:screen">
      <rect width="256" height="256" fill="url(#bgRed)" filter="url(#softBlur)"/>
      <rect width="256" height="256" fill="url(#bgYellow)" filter="url(#softBlur)"/>
      <rect width="256" height="256" fill="url(#bgCyan)" filter="url(#softBlur)"/>
      <rect width="256" height="256" fill="url(#bgPink)" filter="url(#softBlur)"/>
      <rect width="256" height="256" fill="url(#bgCyan2)" filter="url(#softBlur)"/>
    </g>

    <circle cx="42" cy="34" r="7" fill="#ff5a4d"/>
    <circle cx="42" cy="34" r="3" fill="#ffb3ab" opacity="0.8"/>
    <circle cx="205" cy="30" r="6" fill="#ff7a3d"/>
    <circle cx="205" cy="30" r="2.5" fill="#ffd0b3" opacity="0.8"/>
    <circle cx="35" cy="208" r="6" fill="#ffd23d"/>
    <circle cx="35" cy="208" r="2.5" fill="#fff0b3" opacity="0.8"/>

    <g filter="url(#glow)">
      <path d="M40 76 L92 76 L128 158 L164 76 L216 76 L152 208 L128 208 L104 158 L80 208 L56 208 Z"
            fill="none" stroke="#4de0ff" stroke-width="14" stroke-linejoin="round" opacity="0.55"/>
      <path d="M40 76 L92 76 L128 158 L164 76 L216 76 L152 208 L128 208 L104 158 L80 208 L56 208 Z"
            fill="none" stroke="#ff5ac8" stroke-width="7" stroke-linejoin="round" opacity="0.6"/>
    </g>

    <path d="M40 76 L92 76 L128 158 L164 76 L216 76 L152 208 L128 208 L104 158 L80 208 L56 208 Z"
          fill="url(#chrome)" stroke="#15161a" stroke-width="6" stroke-linejoin="round" filter="url(#dropShadow)"/>
    <path d="M96 90 L112 90 L124 118" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.75"/>
    <path d="M132 118 L144 90 L160 90" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
